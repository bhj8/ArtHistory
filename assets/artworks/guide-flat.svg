<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><title>同一个按钮，三种状态：本站学习图解，非历史作品</title><desc>这是静态界面示意，用于比较状态；图中的按钮不能点击。</desc><rect width="1200" height="760" fill="#eeeede"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="60" y="64" font-size="17" fill="#687c6c" >ART HISTORY ATLAS  /  学习图解</text><text x="60" y="116" font-size="36" fill="#233b31" >同一个按钮，三种状态</text><text x="60" y="151" font-size="20" fill="#687c6c" >这是静态界面示意，用于比较状态；图中的按钮不能点击。</text><rect x="60" y="205" width="340" height="375" fill="#fffdf7" rx="12"/><text x="87" y="252" font-size="24" fill="#233b31" >01  默认</text><rect x="90" y="320" width="280" height="72" fill="#37634e" rx="8"/><text x="230" y="365" font-size="26" fill="#fff" text-anchor="middle">保存</text><text x="87" y="455" font-size="21" fill="#233b31" >清楚说明可执行动作</text><text x="87" y="500" font-size="19" fill="#687c6c" >形状不必模仿实物</text><rect x="430" y="205" width="340" height="375" fill="#fffdf7" rx="12"/><text x="457" y="252" font-size="24" fill="#233b31" >02  悬停 / 聚焦</text><rect x="452" y="312" width="296" height="88" fill="none" rx="12" stroke="#a5b896" stroke-width="4"/><rect x="460" y="320" width="280" height="72" fill="#234a38" rx="8"/><text x="600" y="365" font-size="26" fill="#fff" text-anchor="middle">保存</text><text x="457" y="455" font-size="21" fill="#233b31" >颜色与边框提供反馈</text><text x="457" y="500" font-size="19" fill="#687c6c" >键盘焦点同样可见</text><rect x="800" y="205" width="340" height="375" fill="#fffdf7" rx="12"/><text x="827" y="252" font-size="24" fill="#233b31" >03  禁用</text><rect x="830" y="320" width="280" height="72" fill="#d4d9d1" rx="8"/><text x="970" y="365" font-size="26" fill="#737d74" text-anchor="middle">暂不可用</text><text x="827" y="455" font-size="21" fill="#233b31" >文字说明不能操作</text><text x="827" y="500" font-size="19" fill="#687c6c" >不要只靠颜色区别</text><text x="60" y="630" font-size="24" fill="#233b31" >扁平化减少装饰，但仍需要层级、对比和清楚的状态反馈。</text><text x="60" y="704" font-size="18" fill="#687c6c" >本站绘制 · 概念示意，非历史作品或艺术家原作</text></g></svg>