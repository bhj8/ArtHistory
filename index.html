<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="美术史交互图谱：流派、地域传统、设计、媒介、作品与学习路线。"
    />
    <meta name="theme-color" content="#f5f3ed" />
    <title>美术史地图</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <a class="skip" href="#content">跳到内容</a>
    <header class="header">
      <a class="brand" href="./" aria-label="美术史地图首页"
        ><span class="brand-mark" aria-hidden="true">▦</span>
        <h1>美术史地图<small>ART HISTORY ATLAS</small></h1></a
      >
      <div class="searchbox">
        <span aria-hidden="true">⌕</span
        ><input
          id="search"
          type="search"
          autocomplete="off"
          placeholder="搜索流派、人物、作品…"
          aria-label="搜索流派、人物、作品"
        /><button id="clearSearch" aria-label="清空搜索" hidden>×</button
        ><kbd>/</kbd>
      </div>
      <button id="sourcesBtn" class="quiet">资料来源 ↗</button>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="分类筛选">
        <div class="sidebar-label">分类</div>
        <div id="lanes"></div>
        <div class="sidebar-stats" id="stats"></div>
        <button id="random" class="random">随机一条 ↗</button>
      </aside>
      <main class="main">
        <div class="browsebar">
          <nav class="tabs" aria-label="浏览方式">
            <button data-view="map">全景地图</button
            ><button data-view="index">图解词典</button
            ><button data-view="gallery">作品图库</button
            ><button data-view="routes">学习路线</button
            ><button data-view="recent">最近读过</button
            ><button data-view="saved">
              收藏 <span id="savedCount">0</span>
            </button>
          </nav>
          <label class="mobile-lane"
            ><span class="sr-only">分类</span
            ><select id="laneSelect" aria-label="分类筛选"></select
          ></label>
        </div>
        <div class="explore-intro"><div><span class="eyebrow">从一幅作品开始，读懂一个概念</span><p>查一个词，看几幅画，再沿着相关条目继续逛。</p></div><div class="explore-links"><button data-view="index">翻开图解词典 →</button><button data-view="routes">按路线学习 →</button></div></div>
        <div class="search-topics" aria-label="试试这些主题"><span>随手翻翻</span><button data-query="山水">山水</button><button data-query="印象">印象派</button><button data-query="版画">版画</button><button data-query="建筑">建筑</button><button data-query="陶瓷">陶瓷</button><button data-query="摄影">摄影</button></div>
        <div class="era-bar" id="eras" aria-label="时代筛选"></div>
        <div class="resultbar">
          <div>
            <h2 id="viewTitle">全景地图</h2>
            <span id="resultCount" role="status" aria-live="polite"></span>
          </div>
          <div class="result-actions">
            <label class="image-filter"><input type="checkbox" id="illustratedOnly" /> 只看有图</label>
            <button id="reset" hidden>重置筛选 ×</button
            ><select id="sort" aria-label="排序">
              <option value="time">按时代</option>
              <option value="name">按名称</option>
              <option value="images">图片优先</option>
            </select>
          </div>
        </div>
        <div id="activeFilters"></div>
        <div id="content" tabindex="-1">
          <div class="loading">正在载入图谱…</div>
        </div>
        <footer>
          <span>年代为概略范围 · 分区与路线用于导航</span
          ><button id="aboutBtn" class="text-button">收录与使用说明</button
          ><a
            href="https://github.com/bhj8/ArtHistory"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub ↗</a
          >
        </footer>
      </main>
    </div>
    <dialog id="detail" aria-labelledby="detailTitle">
      <div class="drawer-top">
        <button id="backDetail" aria-label="返回上一条已浏览内容" hidden>
          ← 返回</button
        ><span id="crumb"></span
        ><button id="closeDetail" aria-label="关闭详情">关闭 ×</button>
      </div>
      <div id="detailBody"></div>
      <div class="detail-bottom" id="detailNav"></div>
    </dialog>
    <dialog id="lightbox" aria-label="作品大图"></dialog>
    <dialog
      id="comparison"
      class="modal"
      aria-labelledby="comparisonTitle"
    ></dialog>
    <dialog id="info" class="modal" aria-labelledby="infoTitle"></dialog>
    <div id="comparebar" hidden>
      <span id="compareSummary"></span><button id="doCompare">打开对照</button
      ><button id="clearCompare" aria-label="清空对照">清空 ×</button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>此图谱需要启用 JavaScript。</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
